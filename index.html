// PRODUCT FORM (with image upload to Supabase Storage)
// ══════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════
// BULK PRODUCT MODAL
// ══════════════════════════════════════════════════════════
const BulkProductModal=({onClose,onImport})=>{
  const [mode,setMode]=useState('paste'); // paste | csv
  const [text,setText]=useState('');
  const [parsed,setParsed]=useState([]);
  const [error,setError]=useState('');

  const parseText=()=>{
    setError('');
    const lines=text.trim().split('\n').filter(l=>l.trim());
    const results=[];
    for(const line of lines){
      // Support: tab, comma, pipe separated
      const parts=line.split(/[\t,|]/).map(s=>s.trim().replace(/^"|"$/g,''));
      if(parts.length<2){setError(`Can't parse line: "${line}" — need at least Name and Price`);return;}
      let code='',name='',price=0,description='';
      if(parts.length>=3 && isNaN(parseFloat(parts[0])) && !isNaN(parseFloat(parts[2]))){
        // Format: Code, Name, Price, Description
        [code,name]=parts;price=parseFloat(parts[2])||0;description=parts[3]||'';
      } else if(!isNaN(parseFloat(parts[1]))){
        // Format: Name, Price, Description
        name=parts[0];price=parseFloat(parts[1])||0;description=parts[2]||'';
        code=name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,4);
      } else {
        setError(`Can't parse price in: "${line}"`);return;
      }
      if(!name){setError('Empty name found');return;}
      results.push({code,name,price,description,image_url:''});
    }
    setParsed(results);
  };

  const handleCSV=e=>{
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      setText(ev.target.result);
      setMode('paste');
    };
    reader.readAsText(file);
  };

  return(
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal-box">
        <div className="sticky top-0 bg-[#f9f4ec] px-5 pt-5 pb-4 border-b border-[rgba(196,124,58,.12)] flex justify-between items-center">
          <div>
            <h2 className="serif text-xl font-bold text-[#3d1f0f]">Bulk Import Products</h2>
            <p className="text-xs text-[#6b3a22]/50 mt-0.5">Add many products at once</p>
          </div>
          <button onClick={onClose} className="w-8 h-8 rounded-full bg-[rgba(196,124,58,.1)] flex items-center justify-center text-[#6b3a22]"><Icon type="x" className="w-4 h-4"/></button>
        </div>
        <div className="p-5 space-y-4">
          {/* Format guide */}
          <div className="bg-[rgba(196,124,58,.06)] rounded-xl p-4 border border-[rgba(196,124,58,.12)]">
            <p className="text-xs font-bold text-[#3d1f0f] mb-2">📋 Accepted Formats (one product per line):</p>
            <div className="space-y-1 font-mono text-xs text-[#6b3a22]">
              <p className="bg-white/60 px-2 py-1 rounded">Name, Price</p>
              <p className="bg-white/60 px-2 py-1 rounded">Name, Price, Description</p>
              <p className="bg-white/60 px-2 py-1 rounded">Code, Name, Price</p>
              <p className="bg-white/60 px-2 py-1 rounded">Code, Name, Price, Description</p>
            </div>
            <p className="text-[10px] text-[#6b3a22]/40 mt-2">Separator can be comma, tab, or pipe (|). CSV files also accepted.</p>
          </div>

          {/* Example */}
          <div>
            <div className="flex justify-between items-center mb-1.5">
              <label className={labelCls}>Paste Products</label>
              <label className="text-xs text-[#c47c3a] font-semibold cursor-pointer hover:underline">
                📁 Upload CSV
                <input type="file" accept=".csv,.txt" onChange={handleCSV} className="hidden"/>
              </label>
            </div>
            <textarea
              value={text}
              onChange={e=>{setText(e.target.value);setParsed([]);setError('');}}
              placeholder={"KC01, Big Kunafa Chocolate, 250, Crispy kunafa with chocolate\nKC02, Med. Kunafa Chocolate, 125\nKC03, Mini Kunafa Bites, 40"}
              rows="6"
              className="w-full px-3 py-2.5 text-sm font-mono resize-none"
            />
          </div>

          {error&&<p className="text-xs text-red-500 bg-red-50 px-3 py-2 rounded-xl">⚠ {error}</p>}

          <button onClick={parseText} className="btn-ghost w-full py-3 text-sm font-semibold">
            Preview →
          </button>

          {/* Preview table */}
          {parsed.length>0&&(
            <div className="space-y-2">
              <p className="text-xs font-bold text-[#3d1f0f] uppercase tracking-widest">{parsed.length} Products Ready</p>
              <div className="card overflow-hidden divide-y divide-[rgba(196,124,58,.08)] max-h-56 overflow-y-auto">
                {parsed.map((p,i)=>(
                  <div key={i} className="flex items-center gap-3 px-4 py-2.5">
                    <span className="text-xs font-mono font-bold text-[#c47c3a] w-10 flex-shrink-0">{p.code}</span>
                    <span className="flex-1 text-sm font-semibold text-[#1c1410] truncate">{p.name}</span>
                    <span className="text-sm font-bold mono text-[#3d1f0f]">{fc(p.price)}</span>
                    <button onClick={()=>setParsed(parsed.filter((_,j)=>j!==i))} className="text-[#6b3a22]/30 hover:text-red-500 transition"><Icon type="x" className="w-4 h-4"/></button>
                  </div>
                ))}
              </div>
              <button onClick={()=>onImport(parsed)} className="btn-primary w-full py-3.5 text-sm">
                ✓ Import {parsed.length} Products
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
};


const ProductForm=({initial,onSave})=>{
  const [f,setF]=useState({code:'',name:'',price:'',description:'',image_url:'',...(initial?{...initial,price:String(initial.price)}:{})});
  const [uploading,setUploading]=useState(false);
  const [preview,setPreview]=useState(initial?.image_url||'');

  const handleImageUpload=async e=>{
    const file=e.target.files[0];
    if(!file)return;
    if(file.size>5*1024*1024){alert('Image must be under 5MB');return;}
    setUploading(true);
    try{
      const ext=file.name.split('.').pop();
      const fileName=`products/${Date.now()}.${ext}`;
      const{data,error}=await window.__sb.storage.from('product-images').upload(fileName,file,{cacheControl:'3600',upsert:false});
      if(error)throw error;
      const{data:urlData}=window.__sb.storage.from('product-images').getPublicUrl(fileName);
      setF({...f,image_url:urlData.publicUrl});
      setPreview(urlData.publicUrl);
    }catch(err){
      // Fallback: use local base64 preview (no storage bucket)
      const reader=new FileReader();
      reader.onload=ev=>{setPreview(ev.target.result);setF(prev=>({...prev,image_url:ev.target.result}));};
      reader.readAsDataURL(file);
      console.log('Storage fallback to base64');
    }
    setUploading(false);
  };

  return(<div className="space-y-3">
    {/* Image upload */}
    <div>
      <label className={labelCls}>Product Photo</label>
      {preview?<div className="relative mb-2"><img src={preview} alt="preview" className="w-full h-40 object-cover rounded-xl border border-[rgba(196,124,58,.2)]"/><button onClick={()=>{setPreview('');setF({...f,image_url:''}); }} className="absolute top-2 right-2 w-7 h-7 rounded-full bg-red-500 text-white flex items-center justify-center text-xs">✕</button></div>:<div className="w-full h-32 rounded-xl border-2 border-dashed border-[rgba(196,124,58,.3)] flex flex-col items-center justify-center gap-2 text-[#6b3a22]/50 mb-2"><Icon type="photo" className="w-8 h-8"/><span className="text-xs">Upload photo</span></div>}
      <label className="btn-ghost py-2.5 w-full flex items-center justify-center gap-2 text-sm cursor-pointer">{uploading?'Uploading...':<><Icon type="photo" className="w-4 h-4"/>{preview?'Change Photo':'Choose Photo'}</>}<input type="file" accept="image/*" onChange={handleImageUpload} className="hidden" disabled={uploading}/></label>
    </div>
    <div><label className={labelCls}>Code</label><input value={f.code} onChange={e=>setF({...f,code:e.target.value})} className={inputCls} placeholder="KC01"/></div>
    <div><label className={labelCls}>Name *</label><input value={f.name} onChange={e=>setF({...f,name:e.target.value})} className={inputCls} placeholder="Product name"/></div>
    <div><label className={labelCls}>Price (₹) *</label><input type="number" min="0" step=".01" value={f.price} onChange={e=>setF({...f,price:e.target.value})} className={inputCls} placeholder="250"/></div>
    <div><label className={labelCls}>Description</label><textarea value={f.description} onChange={e=>setF({...f,description:e.target.value})} className={`${inputCls} resize-none`} rows="2" placeholder="Short description for store..."/></div>
    <button onClick={()=>{if(!f.name.trim()||!f.price)return;onSave({...f,price:parseFloat(f.price)});}} className="btn-primary w-full py-3 text-sm" disabled={uploading}>{initial?'Save Changes':'Add Product'}</button>
  </div>);
};

// ══════════════════════════════════════════════════════════
// ROOT
// ══════════════════════════════════════════════════════════
const Root=()=>{
  const [mode,setMode]=useState('store'); // store | login | admin

  if(mode==='login')return<LoginScreen onLogin={()=>setMode('admin')}/>;
  if(mode==='admin')return<AdminApp onLogout={()=>setMode('store')}/>;
  return<StoreApp onAdminLogin={()=>setMode('login')}/>;
};

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
</html>
