<style>
:root{--ink:#1c1410;--bark:#3d1f0f;--mocha:#6b3a22;--caramel:#c47c3a;--cream:#f9f4ec;--parchment:#f2ead8;--sage:#7a8c6e;--blush:#e8d5c0;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--parchment);color:var(--ink);min-height:100vh;background-image:radial-gradient(ellipse at 20% 0%,rgba(196,124,58,.08) 0%,transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(61,31,15,.06) 0%,transparent 60%);}
h1,h2,h3,.serif{font-family:'Playfair Display',serif;}
.mono{font-family:'DM Mono',monospace;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:var(--blush);border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:var(--caramel);}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounceIn{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.fade-in{animation:fadeUp .35s cubic-bezier(.22,.68,0,1.2) both;}
.slide-up{animation:slideUp .3s cubic-bezier(.22,.68,0,1.2) both;}
.bounce-in{animation:bounceIn .4s cubic-bezier(.22,.68,0,1.2) both;}
.card{background:rgba(249,244,236,.88);border:1px solid rgba(196,124,58,.18);border-radius:14px;box-shadow:0 2px 12px rgba(61,31,15,.07);}
.card-dark{background:var(--bark);border:1px solid rgba(196,124,58,.2);border-radius:14px;box-shadow:0 4px 24px rgba(28,20,16,.3);}
input,select,textarea{font-family:'DM Sans',sans-serif;background:rgba(242,234,216,.6)!important;border:1.5px solid rgba(196,124,58,.25)!important;border-radius:8px!important;color:var(--ink)!important;transition:all .2s ease;}
input:focus,select:focus,textarea:focus{border-color:var(--caramel)!important;outline:none!important;box-shadow:0 0 0 3px rgba(196,124,58,.12);background:#fff9f3!important;}
input::placeholder,textarea::placeholder{color:rgba(107,58,34,.45)!important;}
select option{background:var(--cream);color:var(--ink);}
.btn-primary{background:var(--bark);color:var(--cream);border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer;transition:all .2s ease;}
.btn-primary:hover{background:var(--mocha);transform:translateY(-1px);box-shadow:0 4px 16px rgba(61,31,15,.3);}
.btn-accent{background:var(--caramel);color:#fff;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer;transition:all .2s ease;}
.btn-accent:hover{background:#b36e2e;transform:translateY(-1px);}
.btn-ghost{background:rgba(196,124,58,.1);color:var(--mocha);border:1.5px solid rgba(196,124,58,.25);border-radius:8px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;transition:all .2s ease;}
.btn-ghost:hover{background:rgba(196,124,58,.18);}
.btn-danger{background:rgba(239,68,68,.1);color:#ef4444;border:1.5px solid rgba(239,68,68,.25);border-radius:8px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;transition:all .2s ease;}
.btn-danger:hover{background:rgba(239,68,68,.2);}
.tab-bar{background:rgba(242,234,216,.7);border:1px solid rgba(196,124,58,.15);border-radius:12px;padding:4px;backdrop-filter:blur(8px);}
.tab-item{border-radius:8px;font-weight:600;font-size:.8125rem;color:var(--mocha);transition:all .2s ease;cursor:pointer;background:transparent;border:none;}
.tab-item.active{background:var(--bark);color:var(--cream);box-shadow:0 2px 8px rgba(61,31,15,.2);}
.tab-item:not(.active):hover{background:rgba(196,124,58,.12);}
.badge-paid{background:rgba(122,140,110,.15);color:#4a5e3a;border:1px solid rgba(122,140,110,.3);border-radius:20px;font-size:.7rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 10px;}
.badge-due{background:rgba(196,124,58,.12);color:var(--mocha);border:1px solid rgba(196,124,58,.25);border-radius:20px;font-size:.7rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 10px;}
.badge-partial{background:rgba(234,179,8,.12);color:#a16207;border:1px solid rgba(234,179,8,.3);border-radius:20px;font-size:.7rem;font-weight:600;padding:2px 10px;}
.rule{border:none;border-top:1px solid rgba(196,124,58,.18);}
.modal-overlay{position:fixed;inset:0;background:rgba(28,20,16,.6);backdrop-filter:blur(6px);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
@media(min-width:640px){.modal-overlay{align-items:center;padding:16px;}}
.modal-box{background:var(--cream);border:1px solid rgba(196,124,58,.2);border-radius:20px 20px 0 0;width:100%;max-height:92vh;overflow-y:auto;}
@media(min-width:640px){.modal-box{border-radius:20px;max-width:520px;}}
.item-btn{transition:all .18s ease;cursor:pointer;}
.item-btn:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(61,31,15,.1);}
.bill-panel::-webkit-scrollbar-thumb{background:rgba(249,244,236,.2);}
.header-bg{background:linear-gradient(135deg,var(--bark) 0%,#5a2d14 50%,var(--mocha) 100%);position:relative;overflow:hidden;}
.header-bg::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 70% 40%,rgba(196,124,58,.2) 0%,transparent 60%);}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
input[type=number]{-moz-appearance:textfield;}
.progress-bar{height:3px;background:rgba(196,124,58,.15);border-radius:10px;overflow:hidden;}
.progress-fill{height:100%;border-radius:10px;background:linear-gradient(to right,var(--mocha),var(--caramel));transition:width .5s ease;}
.stat-card{position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(to right,var(--mocha),var(--caramel));}
/* Store */
.store-hero{background:linear-gradient(135deg,var(--bark) 0%,#5a2d14 60%,var(--mocha) 100%);}
.product-card{background:rgba(249,244,236,.9);border:1.5px solid rgba(196,124,58,.18);border-radius:20px;transition:all .25s ease;overflow:hidden;}
.product-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(61,31,15,.15);border-color:var(--caramel);}
.float-cart{position:fixed;bottom:24px;right:24px;z-index:40;width:62px;height:62px;border-radius:50%;background:var(--bark);color:var(--cream);box-shadow:0 8px 32px rgba(61,31,15,.4);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s ease;}
.float-cart:hover{transform:scale(1.08);}
.cart-badge{position:absolute;top:-6px;right:-6px;background:var(--caramel);color:#fff;border-radius:50%;width:20px;height:20px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.notif-dot{position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;background:var(--caramel);border:2px solid var(--parchment);}
/* Dark mode */
body.dark{--ink:#f0e6d3;--bark:#d4924a;--mocha:#e8c89a;--caramel:#f0a855;--cream:#1a0f06;--parchment:#120a03;--sage:#9ab88a;--blush:#3d2410;background-color:#120a03;}
body.dark .card{background:rgba(26,15,6,.95);border-color:rgba(196,124,58,.25);}
body.dark .card-dark{background:#0b0602;}
body.dark input,body.dark select,body.dark textarea{background:rgba(26,15,6,.9)!important;border-color:rgba(196,124,58,.3)!important;color:#f0e6d3!important;}
body.dark .tab-bar{background:rgba(26,15,6,.85);border-color:rgba(196,124,58,.2);}
body.dark .tab-item{color:#e8c89a;}
body.dark .modal-box{background:#1a0f06!important;}
body.dark .bg-white{background:#1a0f06!important;}
body.dark .text-stone-800{color:#f0e6d3!important;}
body.dark .text-stone-600,.body.dark .text-stone-500,.body.dark .text-stone-400{color:#9a7850!important;}
body.dark .border-stone-100{border-color:rgba(196,124,58,.15)!important;}
body.dark .product-card{background:rgba(26,15,6,.9);}
/* Status */
.s-pending{background:#fef3c7;color:#92400e;border:1px solid #fde68a;}
.s-confirmed{background:#d1fae5;color:#065f46;border:1px solid #6ee7b7;}
.s-ready{background:#dbeafe;color:#1e40af;border:1px solid #93c5fd;}
.s-delivered{background:#f0fdf4;color:#166534;border:1px solid #86efac;}
.s-cancelled{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;}
.order-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
</style>
</head>

const LoginScreen = ({onLogin}) => {
  const [pw,setPw]=useState('');
  const [err,setErr]=useState(false);
  const try_ = () => {
    if(pw===ADMIN_PASSWORD){onLogin();}
    else{setErr(true);setTimeout(()=>setErr(false),2000);}
  };
  return (
    <div className="min-h-screen flex items-center justify-center p-4">

  const [form,setForm]=useState({date:new Date().toISOString().split('T')[0],amount:'',category:'',description:'',notes:''});

  const showToast=(msg,type='success')=>{setToast({msg,type});setTimeout(()=>setToast(null),2500);};
  const saveExp=d=>{setExpenses(d);localStorage.setItem('choco_expenses',JSON.stringify(d));};
  const saveCats=d=>{setCats(d);localStorage.setItem('choco_exp_cats',JSON.stringify(d));};
  const getMeta=name=>{const c=cats.find(c=>c.name===name);return c||{icon:'🗂️',budget:0};};
  const usedCats=[...new Set(expenses.map(e=>e.category))].filter(Boolean);
  const totalAll=expenses.reduce((s,e)=>s+e.amount,0);
  const now=new Date();
  const thisMonthTotal=expenses.filter(e=>{const d=new Date(e.date+'T00:00:00');return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();}).reduce((s,e)=>s+e.amount,0);
  const avgEntry=expenses.length?totalAll/expenses.length:0;
  let filtered=[...expenses];
  if(filterCat!=='all')filtered=filtered.filter(e=>e.category===filterCat);
  if(search.trim())filtered=filtered.filter(e=>(e.description||'').toLowerCase().includes(search.toLowerCase())||(e.notes||'').toLowerCase().includes(search.toLowerCase()));
  if(sort==='date-desc')filtered.sort((a,b)=>new Date(b.date)-new Date(a.date));
  else if(sort==='date-asc')filtered.sort((a,b)=>new Date(a.date)-new Date(b.date));
  else if(sort==='amount-desc')filtered.sort((a,b)=>b.amount-a.amount);
  else if(sort==='amount-asc')filtered.sort((a,b)=>a.amount-b.amount);
  else if(sort==='category')filtered.sort((a,b)=>(a.category||'').localeCompare(b.category||''));
  const months=[...new Set(expenses.map(e=>e.date?e.date.slice(0,7):null).filter(Boolean))].sort().reverse();
  const structFiltered=structMonth==='all'?expenses:expenses.filter(e=>e.date&&e.date.startsWith(structMonth));
  const grouped={};
  structFiltered.forEach(e=>{const c=e.category||'Uncategorized';if(!grouped[c])grouped[c]=[];grouped[c].push(e);});
  const groupedSorted=Object.keys(grouped).sort((a,b)=>grouped[b].reduce((s,e)=>s+e.amount,0)-grouped[a].reduce((s,e)=>s+e.amount,0));
  const handleAdd=ev=>{ev.preventDefault();if(!form.category||!form.amount||!form.description)return;const newExp={id:genId(),date:form.date,amount:parseFloat(form.amount),category:form.category,description:form.description,notes:form.notes,createdAt:new Date().toISOString()};saveExp([newExp,...expenses]);setForm({date:new Date().toISOString().split('T')[0],amount:'',category:'',description:'',notes:''});showToast('Expense added!');setSubTab('list');};
  const handleDel=id=>{if(!window.confirm('Delete?'))return;saveExp(expenses.filter(e=>e.id!==id));showToast('Deleted','info');};
  const handleSaveEdit=()=>{if(!editForm.amount||!editForm.description)return;saveExp(expenses.map(e=>e.id===editExpId?{...e,...editForm,amount:parseFloat(editForm.amount)}:e));setEditExpId(null);showToast('Updated!');};
  const exportCSV=()=>{if(!filtered.length){showToast('Nothing to export','error');return;}const h='Date,Category,Description,Amount,Notes\n';const r=filtered.map(e=>`${e.date},${e.category},"${(e.description||'').replace(/"/g,'""')}",${e.amount},"${(e.notes||'').replace(/"/g,'""')}"`).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h+r],{type:'text/csv'}));a.download='chocolush-expenses.csv';a.click();showToast('Exported!');};

  return (
    <div className="fade-in space-y-4">
      {toast&&<div className={`fixed bottom-6 inset-x-4 sm:left-auto sm:right-6 sm:w-72 z-50 px-5 py-3 rounded-2xl text-white font-semibold text-sm shadow-2xl fade-in ${toast.type==='success'?'bg-[#7a8c6e]':toast.type==='error'?'bg-red-500':'bg-[#3d1f0f]'}`}>{toast.msg}</div>}
      {editExpId&&<div className="modal-overlay"onClick={e=>e.target===e.currentTarget&&setEditExpId(null)}><div className="modal-box p-6 relative"><button onClick={()=>setEditExpId(null)} className="absolute top-4 right-4 text-[#6b3a22]/40 hover:text-[#6b3a22]"><Icon type="x"/></button><h2 className="serif text-xl font-bold text-[#3d1f0f] mb-4">Edit Expense</h2><div className="space-y-3"><div><label className={labelCls}>Date</label><input type="date" value={editForm.date||''} onChange={e=>setEditForm({...editForm,date:e.target.value})} className={inputCls}/></div><div><label className={labelCls}>Amount (₹)</label><input type="number" step=".01" value={editForm.amount||''} onChange={e=>setEditForm({...editForm,amount:e.target.value})} className={inputCls}/></div><div><label className={labelCls}>Category</label><select value={editForm.category||''} onChange={e=>setEditForm({...editForm,category:e.target.value})} className={inputCls}>{cats.map(c=><option key={c.name} value={c.name}>{c.icon} {c.name}</option>)}</select></div><div><label className={labelCls}>Description</label><input type="text" value={editForm.description||''} onChange={e=>setEditForm({...editForm,description:e.target.value})} className={inputCls}/></div><div><label className={labelCls}>Notes</label><textarea value={editForm.notes||''} onChange={e=>setEditForm({...editForm,notes:e.target.value})} className={inputCls} rows="2"/></div><button onClick={handleSaveEdit} className="btn-primary w-full py-3 text-sm">Save Changes</button></div></div></div>}
      {/* Stats */}
      <div className="grid grid-cols-2 gap-3">
        {[{label:'Total Spent',val:fc(totalAll)},{label:'This Month',val:fc(thisMonthTotal)},{label:'Entries',val:expenses.length},{label:'Avg Entry',val:fc(avgEntry)}].map(s=>(
          <div key={s.label} className="card p-4"><p className="text-xs font-bold uppercase tracking-widest text-[#6b3a22]/50 mb-1">{s.label}</p><p className="text-xl font-bold mono text-[#3d1f0f]">{s.val}</p></div>
        ))}
      </div>
      <div className="tab-bar flex gap-1">
        {[{k:'add',l:'Add'},{k:'list',l:'All'},{k:'structured',l:'Grouped'},{k:'categories',l:'Categories'}].map(t=>(
          <button key={t.k} onClick={()=>setSubTab(t.k)} className={`tab-item flex-1 py-2 ${subTab===t.k?'active':''}`}>{t.l}</button>
        ))}
      </div>
      {subTab==='add'&&<div className="card p-5 fade-in"><h3 className="serif font-bold text-[#3d1f0f] mb-4 flex items-center gap-2"><Icon type="receipt" className="w-4 h-4 opacity-60"/>Add Expense</h3><form onSubmit={handleAdd} className="space-y-3"><div className="grid grid-cols-2 gap-3"><div><label className={labelCls}>Date</label><input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})} required className={inputCls}/></div><div><label className={labelCls}>Amount (₹)</label><input type="number" step=".01" min="0" placeholder="0.00" value={form.amount} onChange={e=>setForm({...form,amount:e.target.value})} required className={inputCls}/></div></div><div><label className={labelCls}>Category</label><select value={form.category} onChange={e=>setForm({...form,category:e.target.value})} required className={inputCls}><option value="">Select</option>{cats.map(c=><option key={c.name} value={c.name}>{c.icon} {c.name}</option>)}</select></div><div><label className={labelCls}>Description</label><input type="text" placeholder="Brief description" value={form.description} onChange={e=>setForm({...form,description:e.target.value})} required className={inputCls}/></div><div><label className={labelCls}>Notes (optional)</label><textarea placeholder="Details..." value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} className={inputCls} rows="2"/></div><button type="submit" className="btn-primary w-full py-3 text-sm">Add Expense</button></form></div>}
      {subTab==='list'&&<div className="card overflow-hidden fade-in"><div className="p-4 border-b border-[rgba(196,124,58,.12)] space-y-3"><input type="text" placeholder="🔍 Search..." value={search} onChange={e=>setSearch(e.target.value)} className={`${inputCls} !rounded-xl`}/><div className="flex gap-2 overflow-x-auto pb-1">{['all',...usedCats].map(cat=><button key={cat} onClick={()=>setFilterCat(cat)} className={`whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-bold flex-shrink-0 transition ${filterCat===cat?'bg-[#3d1f0f] text-white':'bg-[rgba(196,124,58,.1)] text-[#6b3a22] hover:bg-[rgba(196,124,58,.2)]'}`}>{cat==='all'?'All':`${getMeta(cat).icon} ${cat}`}</button>)}</div><div className="flex gap-2"><select value={sort} onChange={e=>setSort(e.target.value)} className="flex-1 px-3 py-2 text-xs"><option value="date-desc">📅 Newest</option><option value="date-asc">📅 Oldest</option><option value="amount-desc">💰 High→Low</option><option value="amount-asc">💰 Low→High</option><option value="category">🏷 Category</option></select><button onClick={exportCSV} className="btn-ghost px-3 py-2 text-xs flex items-center gap-1"><Icon type="download" className="w-3.5 h-3.5"/>CSV</button></div></div>{filtered.length===0?<div className="py-12 text-center text-[#6b3a22]/30 italic text-sm">No expenses found</div>:<div className="divide-y divide-[rgba(196,124,58,.08)]">{filtered.map(e=><div key={e.id} className="p-4 hover:bg-[rgba(196,124,58,.02)] transition"><div className="flex justify-between items-start gap-2"><div className="flex-1 min-w-0"><div className="flex items-center gap-2 mb-1 flex-wrap"><span className="text-[10px] font-bold bg-[rgba(196,124,58,.1)] text-[#6b3a22] px-2 py-0.5 rounded-full uppercase">{getMeta(e.category).icon} {e.category}</span><span className="text-[10px] text-[#6b3a22]/50">{new Date(e.date+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</span></div><p className="font-semibold text-sm text-[#1c1410] truncate">{e.description}</p>{e.notes&&<p className="text-[11px] text-[#6b3a22]/40 mt-0.5">{e.notes}</p>}</div><div className="flex flex-col items-end gap-2"><p className="font-bold mono text-[#3d1f0f]">{fc(e.amount)}</p><div className="flex gap-1"><button onClick={()=>{setEditExpId(e.id);setEditForm({...e});}} className="p-1.5 text-[#6b3a22]/40 hover:text-[#6b3a22] transition rounded-lg"><Icon type="edit" className="w-4 h-4"/></button><button onClick={()=>handleDel(e.id)} className="p-1.5 text-[#6b3a22]/40 hover:text-red-500 transition rounded-lg"><Icon type="trash" className="w-4 h-4"/></button></div></div></div></div>)}</div>}</div>}
      {subTab==='structured'&&<div className="space-y-3 fade-in"><select value={structMonth} onChange={e=>setStructMonth(e.target.value)} className={`${inputCls} mb-2`}><option value="all">All Months</option>{months.map(m=><option key={m} value={m}>{m}</option>)}</select>{groupedSorted.map(cat=>{const items=grouped[cat];const total=items.reduce((s,e)=>s+e.amount,0);const open=openGroups[cat];return(<div key={cat} className="card overflow-hidden"><button className="w-full p-4 flex justify-between items-center" onClick={()=>setOpenGroups({...openGroups,[cat]:!open})}><div className="flex items-center gap-2"><span className="text-base">{getMeta(cat).icon}</span><span className="font-bold text-sm text-[#1c1410]">{cat}</span><span className="text-xs text-[#6b3a22]/50">{items.length} items</span></div><div className="flex items-center gap-3"><span className="font-bold mono text-sm text-[#3d1f0f]">{fc(total)}</span><Icon type="chevDown" className={`w-4 h-4 text-[#6b3a22]/40 transition ${open?'rotate-180':''}`}/></div></button>{open&&<div className="border-t border-[rgba(196,124,58,.1)] divide-y divide-[rgba(196,124,58,.08)]">{items.map(e=><div key={e.id} className="px-4 py-3 flex justify-between"><div><p className="text-sm font-semibold text-[#1c1410]">{e.description}</p><p className="text-xs text-[#6b3a22]/50">{e.date}</p></div><p className="font-bold mono text-sm text-[#3d1f0f]">{fc(e.amount)}</p></div>)}</div>}</div>);})}</div>}
      {subTab==='categories'&&<div className="space-y-3 fade-in"><div className="card p-4"><h3 className="serif font-bold text-[#3d1f0f] mb-3">Add Category</h3><div className="flex gap-2"><input placeholder="Name" value={newCat.name} onChange={e=>setNewCat({...newCat,name:e.target.value})} className="flex-1 px-3 py-2 text-sm"/><input placeholder="🏷" maxLength={4} value={newCat.icon} onChange={e=>setNewCat({...newCat,icon:e.target.value})} className="w-16 px-3 py-2 text-sm text-center"/><button onClick={e=>{e.preventDefault();const name=newCat.name.trim();if(!name)return;if(cats.find(c=>c.name.toLowerCase()===name.toLowerCase())){showToast('Already exists!','error');return;}saveCats([...cats,{name,icon:newCat.icon||'🗂️',budget:parseFloat(newCat.budget)||0}]);setNewCat({name:'',icon:'',budget:''});showToast('Added!');}} className="btn-primary px-4 py-2 text-sm">Add</button></div></div><div className="card overflow-hidden">{cats.map(c=><div key={c.name} className="flex items-center gap-3 p-4 border-b border-[rgba(196,124,58,.08)] last:border-0"><span className="text-xl">{c.icon}</span><div className="flex-1"><p className="font-semibold text-sm text-[#1c1410]">{c.name}</p><p className="text-xs text-[#6b3a22]/40">{expenses.filter(e=>e.category===c.name).length} entries</p></div><div className="flex gap-1"><button onClick={()=>{setEditCatName(c.name);setEditCatForm({...c});}} className="p-1.5 text-[#6b3a22]/40 hover:text-[#6b3a22] transition"><Icon type="edit" className="w-4 h-4"/></button><button onClick={()=>{if(!window.confirm('Delete?'))return;saveCats(cats.filter(x=>x.name!==c.name));}} className="p-1.5 text-[#6b3a22]/40 hover:text-red-500 transition"><Icon type="trash" className="w-4 h-4"/></button></div></div>)}</div>
      {editCatName&&<div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setEditCatName(null)}><div className="modal-box p-6 relative"><button onClick={()=>setEditCatName(null)} className="absolute top-4 right-4 text-[#6b3a22]/40"><Icon type="x"/></button><h2 className="serif text-xl font-bold text-[#3d1f0f] mb-4">Edit Category</h2><div className="space-y-3"><div><label className={labelCls}>Name</label><input value={editCatForm.name} onChange={e=>setEditCatForm({...editCatForm,name:e.target.value})} className={inputCls}/></div><div><label className={labelCls}>Icon</label><input maxLength={4} value={editCatForm.icon} onChange={e=>setEditCatForm({...editCatForm,icon:e.target.value})} className={inputCls}/></div><button onClick={()=>{const name=editCatForm.name.trim();if(!name)return;saveCats(cats.map(c=>c.name===editCatName?{name,icon:editCatForm.icon||'🗂️',budget:parseFloat(editCatForm.budget)||0}:c));setEditCatName(null);showToast('Updated!');}} className="btn-primary w-full py-3 text-sm">Save</button></div></div></div>}
      </div>}
    </div>
  );
};

// PROFITS TAB
// ══════════════════════════════════════════════════════════
const SUGGESTED_INGREDIENTS={
  'Big Kunafa Chocolate':[{name:'Kunafa dough',amount:15},{name:'Chocolate',amount:30},{name:'Pistachio',amount:20},{name:'Sugar syrup',amount:5}],
  'Med. Kunafa Chocolate':[{name:'Kunafa dough',amount:8},{name:'Chocolate',amount:15},{name:'Pistachio',amount:10},{name:'Sugar syrup',amount:3}],
  'Mini Kunafa Bites':[{name:'Kunafa dough',amount:2},{name:'Chocolate',amount:4},{name:'Sugar syrup',amount:1}],
};

const ProfitsTab=({products,transactions})=>{
  const [subTab,setSubTab]=useState('costs');
  const [selectedProductId,setSelectedProductId]=useState(products[0]?.id||'');
  const [costSheets,setCostSheets]=useState(()=>{try{return JSON.parse(localStorage.getItem('choco_cost_sheets')||'{}');}catch{return{};}});
  const [newIngName,setNewIngName]=useState('');
  const [newIngAmt,setNewIngAmt]=useState('');
  const [newIngBatch,setNewIngBatch]=useState('');
  const [editingIngIdx,setEditingIngIdx]=useState(null);
  const [editIngForm,setEditIngForm]=useState({});

  const saveCostSheets=d=>{setCostSheets(d);localStorage.setItem('choco_cost_sheets',JSON.stringify(d));};
  const getSheet=id=>{const s=costSheets[id];return s?{...{ingredients:[],packaging:0,labor:0,overhead:0},...s}:{ingredients:[],packaging:0,labor:0,overhead:0};};
  const selectedProduct=products.find(p=>p.id===selectedProductId);
  const sheet=getSheet(selectedProductId);
  const ingCostTotal=sheet.ingredients.reduce((s,i)=>s+(parseFloat(i.amount)||0),0);
  const totalCostPrice=ingCostTotal+(parseFloat(sheet.packaging)||0)+(parseFloat(sheet.labor)||0)+(parseFloat(sheet.overhead)||0);
  const sellingPrice=selectedProduct?.price||0;
  const grossProfit=sellingPrice-totalCostPrice;
  const marginPct=sellingPrice>0?(grossProfit/sellingPrice)*100:0;
  const updateOtherCost=(field,val)=>saveCostSheets({...costSheets,[selectedProductId]:{...getSheet(selectedProductId),[field]:parseFloat(val)||0}});
  const addIngredient=()=>{if(!newIngName.trim()||!newIngAmt)return;const batchSize=parseFloat(newIngBatch)||1;const perPcCost=(parseFloat(newIngAmt)||0)/batchSize;const cur=getSheet(selectedProductId);saveCostSheets({...costSheets,[selectedProductId]:{...cur,ingredients:[...cur.ingredients,{name:newIngName.trim(),amount:parseFloat(perPcCost.toFixed(4))||0}]}});setNewIngName('');setNewIngAmt('');setNewIngBatch('');};
  const removeIngredient=idx=>{const cur=getSheet(selectedProductId);saveCostSheets({...costSheets,[selectedProductId]:{...cur,ingredients:cur.ingredients.filter((_,i)=>i!==idx)}});};
  const getBillProfit=t=>{let costTotal=0;t.items.forEach(item=>{const cs=getSheet(item.product.id);const ingCost=cs.ingredients.reduce((s,i)=>s+(parseFloat(i.amount)||0),0);const cpp=ingCost+(parseFloat(cs.packaging)||0)+(parseFloat(cs.labor)||0)+(parseFloat(cs.overhead)||0);costTotal+=cpp*item.quantity;});return{revenue:t.total,cost:costTotal,profit:t.total-costTotal};};
  const getMonthlyPL=()=>{const m={};transactions.forEach(t=>{const key=new Date(t.date).toLocaleString('default',{month:'long',year:'numeric'});if(!m[key])m[key]={revenue:0,cost:0,collected:0};const bp=getBillProfit(t);m[key].revenue+=bp.revenue;m[key].cost+=bp.cost;m[key].collected+=t.paidAmount;});return Object.entries(m).map(([month,d])=>({month,revenue:d.revenue,cost:d.cost,profit:d.revenue-d.cost,collected:d.collected,margin:d.revenue>0?((d.revenue-d.cost)/d.revenue*100):0}));};
  const monthlyPL=getMonthlyPL();
  const allExpenses=()=>{try{return JSON.parse(localStorage.getItem('choco_expenses')||'[]');}catch{return[];}};

  return(
    <div className="fade-in space-y-4">
      <div className="tab-bar flex gap-1 overflow-x-auto">
        {[['costs','Cost Sheets'],['bills','Bill Profits'],['monthly','Monthly P&L'],['expenses','Expenses']].map(([k,l])=>(
          <button key={k} onClick={()=>setSubTab(k)} className={`tab-item px-3 py-2 whitespace-nowrap ${subTab===k?'active':''}`}>{l}</button>
        ))}
      </div>
      {subTab==='costs'&&(
        <div className="space-y-4">
          <div className="card p-4">
            <p className={labelCls}>Select Product</p>
            <div className="flex gap-2 flex-wrap">
              {products.map(p=><button key={p.id} onClick={()=>setSelectedProductId(p.id)} className={`px-3 py-2 rounded-xl text-sm font-semibold transition border ${selectedProductId===p.id?'bg-[#3d1f0f] text-white border-[#3d1f0f]':'bg-[rgba(196,124,58,.06)] text-[#6b3a22] border-[rgba(196,124,58,.2)] hover:border-[#c47c3a]'}`}>{p.name}</button>)}
            </div>
          </div>
          {selectedProduct&&<div className="space-y-4">
            <div className="grid grid-cols-3 gap-3">
              {[{label:'Cost Price',val:fc(totalCostPrice),color:'text-red-600'},{label:'Selling Price',val:fc(sellingPrice),color:'text-[#1c1410]'},{label:'Gross Profit',val:fc(grossProfit),color:grossProfit>=0?'text-green-600':'text-red-600'}].map(s=>(
                <div key={s.label} className="card p-3 text-center"><p className="text-[10px] font-bold uppercase tracking-wider text-[#6b3a22]/50 mb-1">{s.label}</p><p className={`text-base font-bold mono ${s.color}`}>{s.val}</p></div>
              ))}
            </div>
            <div className="card p-4">
              <div className="flex justify-between text-xs mb-1"><span className="font-bold text-[#6b3a22]/60">Margin</span><span className={`font-bold ${marginPct>=30?'text-green-600':marginPct>=15?'text-amber-500':'text-red-500'}`}>{marginPct.toFixed(1)}%</span></div>
              <div className="progress-bar"><div className="progress-fill" style={{width:`${Math.max(0,Math.min(100,marginPct))}%`}}/></div>
              <p className="text-[10px] text-[#6b3a22]/40 mt-1">{marginPct>=30?'✅ Healthy':marginPct>=15?'⚠️ Moderate':'❌ Low margin'}</p>
            </div>
            <div className="card p-4">
              <p className="font-bold text-sm text-[#3d1f0f] mb-3">Ingredients</p>
              {sheet.ingredients.map((ing,i)=>(
                <div key={i} className="flex items-center gap-2 py-2 border-b border-[rgba(196,124,58,.08)] last:border-0">
                  {editingIngIdx===i?<><input value={editIngForm.name} onChange={e=>setEditIngForm({...editIngForm,name:e.target.value})} className="flex-1 px-2 py-1 text-xs"/><input type="number" value={editIngForm.amount} onChange={e=>setEditIngForm({...editIngForm,amount:e.target.value})} className="w-20 px-2 py-1 text-xs mono"/><button onClick={()=>{const cur=getSheet(selectedProductId);saveCostSheets({...costSheets,[selectedProductId]:{...cur,ingredients:cur.ingredients.map((x,j)=>j===i?{name:editIngForm.name,amount:parseFloat(editIngForm.amount)||0}:x)}});setEditingIngIdx(null);}} className="text-xs btn-primary px-2 py-1">✓</button></>:<><span className="flex-1 text-sm text-[#1c1410]">{ing.name}</span><span className="mono text-xs text-[#6b3a22]/60">{fc(ing.amount)}/pc</span><button onClick={()=>{setEditingIngIdx(i);setEditIngForm({name:ing.name,amount:String(ing.amount)});}} className="p-1 text-[#6b3a22]/40 hover:text-[#6b3a22]"><Icon type="edit" className="w-3.5 h-3.5"/></button><button onClick={()=>removeIngredient(i)} className="p-1 text-[#6b3a22]/40 hover:text-red-500"><Icon type="trash" className="w-3.5 h-3.5"/></button></>}
                </div>
              ))}
              <div className="mt-3 grid grid-cols-3 gap-2">
                <input placeholder="Ingredient" value={newIngName} onChange={e=>setNewIngName(e.target.value)} className="col-span-1 px-2 py-2 text-xs"/>
                <input type="number" placeholder="Cost ₹" value={newIngAmt} onChange={e=>setNewIngAmt(e.target.value)} className="px-2 py-2 text-xs mono"/>
                <input type="number" placeholder="Batch qty" value={newIngBatch} onChange={e=>setNewIngBatch(e.target.value)} className="px-2 py-2 text-xs"/>
              </div>
              <div className="flex gap-2 mt-2">
                <button onClick={addIngredient} className="btn-primary flex-1 py-2 text-xs">+ Add Ingredient</button>
                <button onClick={()=>{if(!selectedProduct)return;const s=SUGGESTED_INGREDIENTS[selectedProduct.name];if(!s){alert('No suggestions');return;}const cur=getSheet(selectedProductId);const ex=cur.ingredients.map(i=>i.name.toLowerCase());const toAdd=s.filter(x=>!ex.includes(x.name.toLowerCase()));if(!toAdd.length){alert('All already added');return;}saveCostSheets({...costSheets,[selectedProductId]:{...cur,ingredients:[...cur.ingredients,...toAdd]}});}} className="btn-ghost py-2 px-3 text-xs">💡 Suggest</button>
              </div>

            <div className="card p-4">

                  <span className="text-xs text-[#6b3a22]/50">₹</span>
                  <input type="number" step=".01" min="0" value={sheet[field]||''} onChange={e=>updateOtherCost(field,e.target.value)} className="flex-1 px-3 py-2 text-sm mono" placeholder="0.00"/>
                  <span className="text-xs text-[#6b3a22]/50">/pc</span>
                </div>
              ))}

          </div>}

      {subTab==='bills'&&<div className="space-y-3 fade-in">{transactions.length===0?<div className="card p-12 text-center text-[#6b3a22]/30 italic">No bills yet</div>:transactions.slice().reverse().map(t=>{const {revenue,cost,profit}=getBillProfit(t);const m=revenue>0?(profit/revenue*100):0;return(<div key={t.id} className="card p-4"><div className="flex justify-between items-start mb-2"><div><p className="font-bold text-[#1c1410]">{t.customerName}</p><p className="text-xs mono text-[#6b3a22]/50">{t.billNumber}</p></div><div className="text-right"><p className="font-bold mono text-[#3d1f0f]">{fc(revenue)}</p><p className={`text-xs font-bold ${profit>=0?'text-green-600':'text-red-500'}`}>Profit: {fc(profit)}</p></div></div><div className="progress-bar"><div className="progress-fill" style={{width:`${Math.max(0,Math.min(100,m))}%`}}/></div><p className="text-xs text-[#6b3a22]/40 mt-1">Margin {m.toFixed(1)}% · Cost {fc(cost)}</p></div>);})}</div>}
      {subTab==='monthly'&&<div className="space-y-3 fade-in">{monthlyPL.length===0?<div className="card p-12 text-center text-[#6b3a22]/30 italic">No data yet</div>:monthlyPL.map(m=>(
        <div key={m.month} className="card p-4">
          <div className="flex justify-between items-start mb-3"><h3 className="font-bold text-[#1c1410]">{m.month}</h3><span className={`text-xs font-bold px-2 py-0.5 rounded-full ${m.margin>=30?'bg-green-100 text-green-700':m.margin>=15?'bg-amber-100 text-amber-700':'bg-red-100 text-red-600'}`}>{m.margin.toFixed(1)}%</span></div>
          <div className="grid grid-cols-2 gap-2 text-sm">
            <div><p className="text-[10px] text-[#6b3a22]/50 uppercase tracking-wider">Revenue</p><p className="font-bold mono text-[#1c1410]">{fc(m.revenue)}</p></div>
            <div><p className="text-[10px] text-[#6b3a22]/50 uppercase tracking-wider">Cost</p><p className="font-bold mono text-red-600">{fc(m.cost)}</p></div>
            <div><p className="text-[10px] text-[#6b3a22]/50 uppercase tracking-wider">Profit</p><p className={`font-bold mono ${m.profit>=0?'text-green-600':'text-red-500'}`}>{fc(m.profit)}</p></div>
            <div><p className="text-[10px] text-[#6b3a22]/50 uppercase tracking-wider">Collected</p><p className="font-bold mono text-[#7a8c6e]">{fc(m.collected)}</p></div>
          </div>
        </div>
      ))}</div>}
      {subTab==='expenses'&&<div className="fade-in"><ExpenseAccount/></div>}
    </div>
  );
};

// ONLINE ORDERS TAB (Supabase)
// ══════════════════════════════════════════════════════════
const OnlineOrdersTab=({products,customers,onConvertToBill})=>{
  const [orders,setOrders]=useState([]);
  const [loading,setLoading]=useState(true);
  const [filter,setFilter]=useState('pending');
  const [selected,setSelected]=useState(null);
  const [toast,setToast]=useState(null);
  const showToast=(msg,type='success')=>{setToast({msg,type});setTimeout(()=>setToast(null),2500);};

  useEffect(()=>{
    const load=async()=>{
      const{data}=await window.__sb.from('orders').select('*').order('created_at',{ascending:false});
      setOrders(data||[]);setLoading(false);
    };
    load();
    const channel=window.__sb.channel('orders-admin').on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>load()).subscribe();
    return()=>window.__sb.removeChannel(channel);
  },[]);

  const updateStatus=async(id,status)=>{
    await window.__sb.from('orders').update({status}).eq('id',id);
    setOrders(prev=>prev.map(o=>o.id===id?{...o,status}:o));
    if(selected?.id===id)setSelected(prev=>({...prev,status}));
    showToast(`Marked as ${status}`);
  };
  const deleteOrder=async id=>{
    if(!window.confirm('Delete?'))return;
    await window.__sb.from('orders').delete().eq('id',id);
    setOrders(prev=>prev.filter(o=>o.id!==id));setSelected(null);showToast('Deleted','info');
  };
  const convertToBill=order=>{
    const matched=customers.find(c=>c.phone&&order.phone&&c.phone.replace(/\D/g,''===order.phone.replace(/\D/g,'')));
    const newItems=(order.cart||[]).map(oi=>{const prod=products.find(p=>p.id===oi.id||p.name===oi.name);if(!prod)return null;return{product:prod,quantity:oi.qty,offerPrice:null,itemDiscount:0,itemDiscountType:'percent'};}).filter(Boolean);
    onConvertToBill({customer:matched,items:newItems});
    updateStatus(order.id,'confirmed');
    showToast('Loaded into billing!');
  };
  const waNotify=order=>{
    const statusMsg={confirmed:`Hi ${order.name}! 🍫 Your Chocolush order is *confirmed*!`,ready:`Hi ${order.name}! 🎉 Your order is *ready*!`,delivered:`Hi ${order.name}! ✅ Order *delivered*. Thank you! 🍫`}[order.status]||`Hi ${order.name}! Update on your Chocolush order.`;
    window.open(`https://wa.me/${(order.phone||'').replace(/\D/g,'')}?text=${encodeURIComponent(statusMsg)}`,'_blank');
  };

  const filtered=filter==='all'?orders:orders.filter(o=>o.status===filter);
  const counts={pending:orders.filter(o=>o.status==='pending').length,confirmed:orders.filter(o=>o.status==='confirmed').length,ready:orders.filter(o=>o.status==='ready').length};
  const statusCls={pending:'s-pending',confirmed:'s-confirmed',ready:'s-ready',delivered:'s-delivered',cancelled:'s-cancelled'};
  const statusLabel={pending:'Pending',confirmed:'Confirmed',ready:'Ready',delivered:'Delivered',cancelled:'Cancelled'};

  if(loading)return<div className="flex items-center justify-center py-20"><div className="animate-spin rounded-full h-8 w-8 border-2 border-[#c47c3a] border-t-transparent"/></div>;

  return(
    <div className="fade-in space-y-4">
      {toast&&<div className={`fixed bottom-6 inset-x-4 sm:left-auto sm:right-6 sm:w-72 z-50 px-5 py-3 rounded-2xl text-white font-semibold text-sm shadow-2xl ${toast.type==='info'?'bg-[#3d1f0f]':toast.type==='error'?'bg-red-500':'bg-[#7a8c6e]'}`}>{toast.msg}</div>}
      <div className="grid grid-cols-3 gap-3">
        {[{label:'Pending',val:counts.pending,color:'text-amber-600'},{label:'Confirmed',val:counts.confirmed,color:'text-blue-600'},{label:'Ready',val:counts.ready,color:'text-green-600'}].map(s=>(
          <div key={s.label} className="card p-3 text-center"><p className="text-[10px] font-bold uppercase tracking-widest text-[#6b3a22]/50 mb-1">{s.label}</p><p className={`text-2xl font-bold mono ${s.color}`}>{s.val}</p></div>
        ))}
      </div>
      <div className="tab-bar flex gap-1 overflow-x-auto">
        {['all','pending','confirmed','ready','delivered','cancelled'].map(f=>(
          <button key={f} onClick={()=>setFilter(f)} className={`tab-item flex-1 py-2 whitespace-nowrap text-xs capitalize ${filter===f?'active':''}`}>{f}</button>
        ))}
      </div>
      <div className="card overflow-hidden">
        {filtered.length===0?<div className="py-16 text-center text-[#6b3a22]/30 italic text-sm">No orders here</div>:
        <div className="divide-y divide-[rgba(196,124,58,.08)]">
          {filtered.map(o=>(
            <div key={o.id} className="p-4 hover:bg-[rgba(196,124,58,.02)] cursor-pointer transition" onClick={()=>setSelected(o)}>
              <div className="flex justify-between items-start gap-2 mb-2">
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 flex-wrap"><p className="font-bold text-sm text-[#1c1410]">{o.name}</p><span className="text-xs bg-[rgba(196,124,58,.1)] text-[#6b3a22] px-2 py-0.5 rounded-full font-semibold capitalize">{o.order_type}</span></div>
                  <p className="text-xs text-[#6b3a22]/50 mono">{o.phone}</p>
                </div>
                <div className="text-right flex-shrink-0"><span className={`order-badge ${statusCls[o.status||'pending']}`}>{statusLabel[o.status||'pending']}</span><p className="font-bold mono text-sm text-[#3d1f0f] mt-1">{fc(o.total)}</p></div>
              </div>
              <p className="text-xs text-[#6b3a22]/50 truncate">{(o.cart||[]).map(i=>`${i.name}×${i.qty}`).join(' · ')}</p>
              {o.preorder_date&&<p className="text-xs text-blue-600 font-semibold mt-1">📅 {o.preorder_date}</p>}
            </div>
          ))}
        </div>}
      </div>
      {selected&&(
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setSelected(null)}>
          <div className="modal-box">
            <div className="sticky top-0 bg-[#f9f4ec] px-5 pt-5 pb-4 border-b border-[rgba(196,124,58,.12)] flex justify-between items-center">
              <div><h2 className="serif text-xl font-bold text-[#3d1f0f]">{selected.name}</h2><p className="text-xs text-[#6b3a22]/50 mono">{selected.phone}</p></div>
              <div className="flex items-center gap-2"><span className={`order-badge ${statusCls[selected.status||'pending']}`}>{statusLabel[selected.status||'pending']}</span><button onClick={()=>setSelected(null)} className="p-1 text-[#6b3a22]/40 hover:text-[#6b3a22]"><Icon type="x"/></button></div>
            </div>
            <div className="p-5 space-y-4">
              <div className="bg-[rgba(196,124,58,.06)] rounded-xl p-4 border border-[rgba(196,124,58,.12)]">
                {selected.address&&<p className="text-sm text-[#6b3a22]">📍 {selected.address}</p>}
                {selected.notes&&<p className="text-xs text-[#6b3a22]/60 mt-1">📝 {selected.notes}</p>}
                <div className="flex gap-3 mt-2 text-xs text-[#6b3a22]/50 flex-wrap"><span className="capitalize font-semibold">{selected.order_type}</span>{selected.preorder_date&&<span className="text-blue-600 font-semibold">📅 {selected.preorder_date}</span>}<span>{selected.created_at?new Date(selected.created_at).toLocaleString('en-IN'):''}</span></div>
              </div>
              <div>
                <p className={`${labelCls} mb-2`}>Items</p>
                {(selected.cart||[]).map((item,i)=><div key={i} className="flex justify-between py-2 border-b border-[rgba(196,124,58,.08)]"><span className="text-sm font-semibold text-[#1c1410]">{item.name} <span className="text-[#6b3a22]/50">×{item.qty}</span></span><span className="font-bold mono text-sm text-[#3d1f0f]">{fc(item.price*item.qty)}</span></div>)}
                <div className="flex justify-between font-bold text-base pt-3"><span className="serif">Total</span><span className="mono text-[#c47c3a]">{fc(selected.total)}</span></div>
              </div>
              <div>
                <p className={`${labelCls} mb-2`}>Update Status</p>
                <div className="grid grid-cols-2 gap-2">
                  {['pending','confirmed','ready','delivered','cancelled'].map(s=>(
                    <button key={s} onClick={()=>updateStatus(selected.id,s)} className={`py-2.5 px-3 rounded-xl text-xs font-bold border-2 capitalize transition ${selected.status===s?'border-[#3d1f0f] bg-[#3d1f0f] text-white':'border-[rgba(196,124,58,.2)] text-[#6b3a22] hover:border-[#c47c3a]'}`}>{s}</button>
                  ))}
                </div>
              </div>
              <div className="grid grid-cols-2 gap-2">
                <button onClick={()=>waNotify(selected)} className="btn-primary py-3 text-sm flex items-center justify-center gap-1"><Icon type="whatsapp" className="w-4 h-4"/>Notify</button>
                <button onClick={()=>convertToBill(selected)} className="btn-accent py-3 text-sm">🧾 To Bill</button>
              </div>
              <button onClick={()=>deleteOrder(selected.id)} className="btn-danger w-full py-2.5 text-xs">🗑 Delete Order</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

// STORE APP (Customer-facing)
// ══════════════════════════════════════════════════════════
const StoreApp=({onAdminLogin})=>{
  const [products,setProducts]=useState([]);
  const [cart,setCart]=useState([]);
  const [showCart,setShowCart]=useState(false);
  const [showTrack,setShowTrack]=useState(false);
  const [cartStep,setCartStep]=useState('cart');
  const [form,setForm]=useState({name:'',phone:'',address:'',notes:''});
  const [orderType,setOrderType]=useState('delivery');
  const [preorderDate,setPreorderDate]=useState('');
  const [loading,setLoading]=useState(false);
  const [toast,setToast]=useState(null);
  const [orderId,setOrderId]=useState('');
  const [trackPhone,setTrackPhone]=useState('');
  const [trackOrders,setTrackOrders]=useState(null);
  const [trackLoading,setTrackLoading]=useState(false);

  const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(null),2000);};
  const itemCount=cart.reduce((s,i)=>s+i.qty,0);
  const cartTotal=cart.reduce((s,i)=>s+i.price*i.qty,0);

  const loadProducts=useCallback(async()=>{
    try{
      const{data,error}=await window.__sb.from('products').select('*');
      if(!error&&data&&data.length>0){
        // Merge: Supabase data + localStorage images (base64 stored locally)
        const localRaw=localStorage.getItem('chocolush_products');
        const localProds=localRaw?JSON.parse(localRaw):[];
        const merged=data.map(sp=>{
          const local=localProds.find(l=>l.id===sp.id);
          const img=(sp.image_url&&sp.image_url!=='')?sp.image_url:(local?.image_url||'');
          return{...sp,price:parseFloat(sp.price)||0,image_url:img};
        });
        setProducts(merged);
      } else {
        // Fallback: use admin's localStorage products
        const sp=localStorage.getItem('chocolush_products');
        if(sp){
          const p=JSON.parse(sp).map(x=>({...x,price:parseFloat(x.price)||0}));
          if(p.length>0)setProducts(p);
        }
      }
    }catch(e){
      const sp=localStorage.getItem('chocolush_products');
      if(sp){
        const p=JSON.parse(sp).map(x=>({...x,price:parseFloat(x.price)||0}));
        if(p.length>0)setProducts(p);
      }
    }
  },[]);

  useEffect(()=>{
    loadProducts();
    // Poll every 10 seconds as reliable fallback
    const poll=setInterval(loadProducts,10000);
    // Also try realtime
    const ch=window.__sb.channel('store-rt-'+Date.now())
      .on('postgres_changes',{event:'*',schema:'public',table:'products'},payload=>{
        console.log('Realtime event:',payload);
        loadProducts();
      })
      .subscribe((status)=>console.log('Realtime status:',status));
    return()=>{clearInterval(poll);window.__sb.removeChannel(ch);};
  },[loadProducts]);

  const addToCart=p=>{setCart(prev=>{const ex=prev.find(i=>i.id===p.id);return ex?prev.map(i=>i.id===p.id?{...i,qty:i.qty+1}:i):[...prev,{...p,qty:1}];});showToast(`${p.name} added!`);};
  const changeQty=(id,qty)=>{if(qty<1)setCart(prev=>prev.filter(i=>i.id!==id));else setCart(prev=>prev.map(i=>i.id===id?{...i,qty}:i));};
  const placeOrder=async()=>{
    if(!form.name.trim()||!form.phone.trim())return;
    setLoading(true);
    try{
      const{data,error}=await window.__sb.from('orders').insert({name:form.name,phone:form.phone,address:form.address,notes:form.notes,order_type:orderType,preorder_date:preorderDate,cart:cart.map(i=>({id:i.id,code:i.code,name:i.name,price:i.price,qty:i.qty})),total:cartTotal,status:'pending',created_at:Date.now()}).select().single();
      if(error)throw error;
      setOrderId(data.id);setCartStep('success');setCart([]);
    }catch(e){alert('Failed to place order. Try again.');}
    setLoading(false);
  };
  const waShare=()=>{
    const lines=[`🍫 *Chocolush Order*`,``,`*Customer:* ${form.name}`,`*Phone:* ${form.phone}`,orderType==='delivery'?`*Address:* ${form.address}`:'',orderType==='preorder'?`*Pre-order Date:* ${preorderDate}`:'',``,`*Items:*`,...cart.map(i=>`  • ${i.name} × ${i.qty} = ${fc(i.price*i.qty)}`),``,`*Total: ${fc(cartTotal)}*`,`Order ID: ${orderId}`].filter(x=>x!==null&&x!==false&&x!=='').join('\n');
    window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(lines)}`,'_blank');
  };
  const searchOrders=async()=>{
    if(!trackPhone.trim())return;
    setTrackLoading(true);
    const{data}=await window.__sb.from('orders').select('*').eq('phone',trackPhone.trim()).order('created_at',{ascending:false});
    setTrackOrders(data||[]);setTrackLoading(false);
  };
  const statusCls={pending:'s-pending',confirmed:'s-confirmed',ready:'s-ready',delivered:'s-delivered',cancelled:'s-cancelled'};
  const statusLabel={pending:'Pending',confirmed:'Confirmed',ready:'Ready 🎉',delivered:'Delivered ✅',cancelled:'Cancelled'};
  const EMOJIS={KC01:'🍫',KC02:'🍬',KC03:'✨'};
  const DESCS={KC01:'Layers of crispy kunafa, rich chocolate ganache & pistachio dust.',KC02:'Perfect mid-size — kunafa crunch meets rich chocolate.',KC03:'Pop-able bites of kunafa, chocolate & joy.'};

  return(
    <div className="min-h-screen" style={{background:'var(--parchment)'}}>
      {toast&&<div className="fixed top-6 inset-x-4 sm:left-auto sm:right-6 sm:w-64 z-[60] bg-[#3d1f0f] text-white px-4 py-3 rounded-xl text-sm font-semibold shadow-2xl bounce-in text-center">{toast}</div>}
      {/* Hero */}
      <div className="store-hero text-white relative">
        <div className="absolute inset-0 opacity-5" style={{backgroundImage:'repeating-linear-gradient(45deg,#fff 0,#fff 1px,transparent 0,transparent 50%)',backgroundSize:'20px 20px'}}/>
        <div className="relative z-10 max-w-2xl mx-auto px-5 py-10">
          <div className="flex justify-between items-center mb-10">
            <div><h1 className="serif text-3xl font-bold text-[#f9f4ec]">Chocolush</h1><p className="text-[#c47c3a] text-xs font-semibold tracking-widest uppercase mt-0.5">Handcrafted · Kerala</p></div>
            <div className="flex gap-2">
              <button onClick={loadProducts} className="flex items-center gap-2 px-3 py-2 rounded-xl text-sm font-semibold bg-white/10 hover:bg-white/20 transition border border-white/20"><Icon type="refresh" className="w-4 h-4"/></button>
              <button onClick={()=>setShowTrack(true)} className="flex items-center gap-2 px-3 py-2 rounded-xl text-sm font-semibold bg-white/10 hover:bg-white/20 transition border border-white/20"><Icon type="track" className="w-4 h-4"/>Track</button>
              <button onClick={onAdminLogin} className="flex items-center gap-2 px-3 py-2 rounded-xl text-sm font-semibold bg-white/10 hover:bg-white/20 transition border border-white/20"><Icon type="lock" className="w-4 h-4"/>Admin</button>
            </div>
          </div>
          <p className="text-4xl font-bold leading-tight mb-3 serif">Kunafa meets<br/><em>Chocolate</em> 🍫</p>
          <p className="text-white/70 text-sm leading-relaxed max-w-xs mb-6">Handcrafted in Kerala with love. Crispy kunafa, rich ganache, pure indulgence.</p>
          <div className="flex gap-3 flex-wrap">{['🌿 100% Halal','🤲 Handmade','📦 Fresh Daily'].map(l=><span key={l} className="px-3 py-1.5 rounded-full bg-white/10 text-xs font-semibold border border-white/20">{l}</span>)}</div>
        </div>
      </div>
      {/* Products */}
      <div className="max-w-2xl mx-auto px-5 py-8 space-y-4">
        <div className="flex justify-between items-center mb-2"><h2 className="serif text-xl font-bold text-[#1c1410]">Our Products</h2><span className="text-xs text-[#6b3a22]/50 font-semibold uppercase tracking-widest">{products.length} Items</span></div>
        {products.map((p,i)=>{
          const inCart=cart.find(c=>c.id===p.id);
          return(
            <div key={p.id} className="product-card fade-in" style={{animationDelay:`${i*.08}s`}}>
              {/* Product image */}
              {p.image_url&&<img src={p.image_url} alt={p.name} className="w-full h-48 object-cover"/>}
              <div className="p-5 flex gap-4 items-start">
                {!p.image_url&&<div className="w-20 h-20 rounded-2xl flex items-center justify-center flex-shrink-0" style={{background:'linear-gradient(135deg,#f2ead8,#e8d5c0)'}}><span className="text-5xl">{EMOJIS[p.code]||'🍫'}</span></div>}
                <div className="flex-1 min-w-0">
                  <div className="flex justify-between items-start gap-2 mb-1"><h3 className="font-bold text-base text-[#1c1410] leading-snug">{p.name}</h3><span className="text-xs font-mono font-bold text-[#6b3a22] bg-[rgba(196,124,58,.1)] px-2 py-0.5 rounded-lg flex-shrink-0">{p.code}</span></div>
                  {p.description&&<p className="text-xs text-[#6b3a22] leading-relaxed mb-2">{p.description}</p>}
                  {!p.description&&<p className="text-xs text-[#6b3a22] leading-relaxed mb-2">{DESCS[p.code]||'Premium kunafa chocolate.'}</p>}
                  <div className="flex items-center justify-between">
                    <span className="text-xl font-bold serif">{fc(p.price)}</span>

                  </div>
                </div>
              </div>
            </div>
          );
        })}
        {/* Info */}
        <div className="p-5 rounded-2xl bg-white/60 border border-[rgba(196,124,58,.15)]"><h3 className="font-bold text-[#1c1410] mb-2 flex items-center gap-2"><Icon type="store" className="w-4 h-4 text-[#c47c3a]"/>Order Info</h3><p className="text-sm text-[#6b3a22] leading-relaxed">Based in <strong>Kasaragod, Kerala</strong>. Delivery available locally. Bulk or pre-orders — WhatsApp us.</p></div>
        <div className="p-5 rounded-2xl text-white" style={{background:'linear-gradient(135deg,#3d1f0f,#6b3a22)'}}><h3 className="font-bold mb-2 flex items-center gap-2"><Icon type="whatsapp" className="w-4 h-4 text-[#c47c3a]"/>Bulk / Custom Orders?</h3><p className="text-sm text-white/70 mb-3">Events, gifting, corporate — we do it all.</p><a href={`https://wa.me/${WA_NUMBER}`} target="_blank" className="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold text-white bg-[#c47c3a]"><Icon type="whatsapp" className="w-4 h-4"/>Message Us</a></div>
        <p className="text-center text-[#6b3a22]/30 text-xs py-4">Made with 🤎 by Chocolush · Kasaragod, Kerala</p>
      </div>
      {/* Float cart */}
      {itemCount>0&&<button className="float-cart bounce-in" onClick={()=>{setCartStep('cart');setShowCart(true);}}><Icon type="cart" className="w-6 h-6"/><span className="cart-badge">{itemCount}</span></button>}
      {/* Bottom bar */}
      {itemCount>0&&!showCart&&<div className="fixed bottom-0 left-0 right-0 z-30 p-4" style={{background:'linear-gradient(to top,var(--parchment) 70%,transparent)'}}><button onClick={()=>{setCartStep('cart');setShowCart(true);}} className="btn-primary w-full py-4 flex items-center justify-between px-6 max-w-2xl mx-auto text-base"><span className="bg-white/20 rounded-lg px-2 py-0.5 text-sm font-bold">{itemCount}</span><span>View Order</span><span className="serif">{fc(cartTotal)}</span></button></div>}
      {/* Cart modal */}
      {showCart&&(
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setShowCart(false)}>
          <div className="modal-box slide-up">
            {cartStep==='cart'&&<>
              <div className="sticky top-0 bg-[#f9f4ec] p-5 border-b border-[rgba(196,124,58,.12)] flex justify-between items-center"><div><h2 className="serif text-xl font-bold text-[#3d1f0f]">Your Order</h2><p className="text-xs text-[#6b3a22] font-medium">{itemCount} item{itemCount!==1?'s':''}</p></div><button onClick={()=>setShowCart(false)} className="w-8 h-8 rounded-full bg-[rgba(196,124,58,.1)] flex items-center justify-center text-[#6b3a22]"><Icon type="x" className="w-4 h-4"/></button></div>
              <div className="p-5 space-y-3">
                {cart.map(item=><div key={item.id} className="flex items-center gap-3 p-3 rounded-2xl bg-[rgba(196,124,58,.06)] border border-[rgba(196,124,58,.12)]"><span className="text-3xl">{EMOJIS[item.code]||'🍫'}</span><div className="flex-1 min-w-0"><p className="font-semibold text-sm text-[#1c1410] truncate">{item.name}</p><p className="text-xs text-[#6b3a22]">{fc(item.price)} each</p></div><div className="flex items-center gap-2"><button className="w-7 h-7 rounded-lg border border-[rgba(196,124,58,.3)] flex items-center justify-center font-bold text-[#6b3a22] hover:bg-[#3d1f0f] hover:text-white transition text-sm" onClick={()=>changeQty(item.id,item.qty-1)}>−</button><span className="w-6 text-center font-bold text-sm">{item.qty}</span><button className="w-7 h-7 rounded-lg border border-[rgba(196,124,58,.3)] flex items-center justify-center font-bold text-[#6b3a22] hover:bg-[#3d1f0f] hover:text-white transition text-sm" onClick={()=>changeQty(item.id,item.qty+1)}>+</button></div><p className="font-bold text-sm text-[#3d1f0f] w-14 text-right mono">{fc(item.price*item.qty)}</p></div>)}
                <hr className="rule"/>
                <div className="flex justify-between items-center px-1"><span className="font-semibold text-[#6b3a22]">Total</span><span className="text-2xl font-bold serif">{fc(cartTotal)}</span></div>
                <button onClick={()=>setCartStep('details')} className="btn-primary w-full py-4 text-base">Continue to Details →</button>
              </div>
            </>}
            {cartStep==='details'&&<>
              <div className="sticky top-0 bg-[#f9f4ec] p-5 border-b border-[rgba(196,124,58,.12)] flex justify-between items-center"><div><h2 className="serif text-xl font-bold text-[#3d1f0f]">Your Details</h2><p className="text-xs text-[#6b3a22] font-medium">Almost there!</p></div><button onClick={()=>setCartStep('cart')} className="text-xs text-[#6b3a22] font-semibold hover:text-[#3d1f0f]">← Back</button></div>
              <div className="p-5 space-y-4">
                <div><p className={labelCls}>Order Type</p><div className="grid grid-cols-3 gap-2">{[['delivery','🛵 Delivery'],['pickup','🏪 Pickup'],['preorder','📅 Pre-order']].map(([v,l])=><button key={v} onClick={()=>setOrderType(v)} className={`py-3 px-2 rounded-xl text-xs font-semibold border-2 transition ${orderType===v?'border-[#3d1f0f] bg-[#3d1f0f] text-white':'border-[rgba(196,124,58,.25)] text-[#6b3a22]'}`}>{l}</button>)}</div></div>
                <div><label className={labelCls}>Your Name *</label><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Full name" className={inputCls}/></div>
                <div><label className={labelCls}>WhatsApp Number *</label><input value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="+91 XXXXX XXXXX" type="tel" className={inputCls}/></div>
                {orderType==='delivery'&&<div><label className={labelCls}>Delivery Address *</label><textarea value={form.address} onChange={e=>setForm({...form,address:e.target.value})} placeholder="Full address" rows="2" className={`${inputCls} resize-none`}/></div>}
                {orderType==='preorder'&&<div><label className={labelCls}>Required Date *</label><input type="date" value={preorderDate} onChange={e=>setPreorderDate(e.target.value)} className={inputCls} min={new Date(Date.now()+86400000).toISOString().split('T')[0]}/></div>}
                <div><label className={labelCls}>Notes (optional)</label><textarea value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} placeholder="Special requests?" rows="2" className={`${inputCls} resize-none`}/></div>
                <div className="bg-[rgba(196,124,58,.08)] rounded-2xl p-4 border border-[rgba(196,124,58,.12)]">
                  {cart.map(i=><div key={i.id} className="flex justify-between text-sm mb-1"><span className="text-[#6b3a22]">{i.name} × {i.qty}</span><span className="font-semibold mono">{fc(i.price*i.qty)}</span></div>)}
                  <hr className="rule my-2"/>
                  <div className="flex justify-between font-bold text-base"><span>Total</span><span className="serif">{fc(cartTotal)}</span></div>
                </div>
                <button onClick={placeOrder} disabled={!form.name.trim()||!form.phone.trim()||loading} className="btn-primary w-full py-4 text-base disabled:opacity-50 disabled:cursor-not-allowed">{loading?'Placing Order...':'Place Order 🍫'}</button>
              </div>
            </>}
            {cartStep==='success'&&<div className="p-8 text-center">
              <div className="text-6xl mb-4 bounce-in">🎉</div>
              <h2 className="serif text-2xl font-bold mb-2 text-[#3d1f0f]">Order Placed!</h2>
              <p className="text-[#6b3a22] text-sm mb-1">We received your order and will confirm shortly.</p>
              <p className="text-xs text-[#6b3a22]/40 font-mono mb-6">{orderId.slice(0,20)}...</p>
              <button onClick={waShare} className="btn-accent w-full py-4 text-base flex items-center justify-center gap-2 mb-3"><Icon type="whatsapp" className="w-5 h-5"/>Chat on WhatsApp</button>
              <button onClick={()=>setShowCart(false)} className="btn-ghost w-full py-3 text-sm">Continue Shopping</button>
            </div>}
          </div>
        </div>
      )}
      {/* Track modal */}
      {showTrack&&(
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setShowTrack(false)}>
          <div className="modal-box slide-up">
            <div className="sticky top-0 bg-[#f9f4ec] p-5 border-b border-[rgba(196,124,58,.12)] flex justify-between items-center">
              <h2 className="serif text-xl font-bold text-[#3d1f0f]">Track Order</h2>
              <button onClick={()=>setShowTrack(false)} className="w-8 h-8 rounded-full bg-[rgba(196,124,58,.1)] flex items-center justify-center text-[#6b3a22]"><Icon type="x" className="w-4 h-4"/></button>
            </div>
            <div className="p-5">
              <p className="text-sm text-[#6b3a22] mb-4">Enter the phone number you used to order.</p>
              <div className="flex gap-2 mb-5">
                <input value={trackPhone} onChange={e=>setTrackPhone(e.target.value)} onKeyDown={e=>e.key==='Enter'&&searchOrders()} placeholder="+91 XXXXX XXXXX" type="tel" className={`flex-1 ${inputCls}`}/>
                <button onClick={searchOrders} className="btn-primary px-5 py-2.5 text-sm">Track</button>
              </div>
              {trackLoading&&<div className="text-center py-8 text-[#6b3a22]/40 text-sm">Searching...</div>}
              {trackOrders!==null&&!trackLoading&&(
                trackOrders.length===0?<div className="text-center py-8 text-[#6b3a22]/40 italic text-sm">No orders found for this number.</div>:
                <div className="space-y-3">
                  {trackOrders.map(o=>(
                    <div key={o.id} className="p-4 rounded-2xl bg-white border border-[rgba(196,124,58,.15)] shadow-sm">
                      <div className="flex justify-between items-start mb-2">
                        <div><p className="font-bold text-sm text-[#1c1410]">{o.name}</p><p className="text-xs text-[#6b3a22]/50 mono">{o.id.slice(0,18)}...</p></div>
                        <span className={`order-badge ${statusCls[o.status||'pending']}`}>{statusLabel[o.status||'pending']}</span>
                      </div>
                      <p className="text-xs text-[#6b3a22]/60 mb-2">{(o.cart||[]).map(i=>`${i.name} ×${i.qty}`).join(' · ')}</p>
                      <div className="flex justify-between items-center"><span className="text-xs text-[#6b3a22]/40 capitalize">{o.order_type}</span><span className="font-bold mono text-sm text-[#3d1f0f]">{fc(o.total)}</span></div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

// ADMIN APP (full billing + all features)
// ══════════════════════════════════════════════════════════
const AdminApp=({onLogout})=>{
  const [tab,setTab]=useState('billing');
  const [customers,setCustomers]=useState([]);
  const [products,setProducts]=useState([]);
  const [transactions,setTransactions]=useState([]);
  const [bill,setBill]=useState({items:[],discount:0,discountType:'percentage'});
  const [selectedCustomer,setSelectedCustomer]=useState(null);
  const [loading,setLoading]=useState(true);
  const [showCustomerModal,setShowCustomerModal]=useState(false);
  const [showProductModal,setShowProductModal]=useState(false);
  const [showBulkModal,setShowBulkModal]=useState(false);
  const [showBillPreview,setShowBillPreview]=useState(false);
  const [showPaymentModal,setShowPaymentModal]=useState(false);
  const [showDetailsModal,setShowDetailsModal]=useState(false);
  const [showAccountsModal,setShowAccountsModal]=useState(false);
  const [editingCustomer,setEditingCustomer]=useState(null);
  const [editingProduct,setEditingProduct]=useState(null);
  const [selectedTransaction,setSelectedTransaction]=useState(null);
  const [paymentAmount,setPaymentAmount]=useState('');
  const [darkMode,setDarkMode]=useState(()=>localStorage.getItem('choco_dark')==='true');
  const [customerHistoryId,setCustomerHistoryId]=useState(null);
  const [reportFilter,setReportFilter]=useState('all');
  const [reportFrom,setReportFrom]=useState('');
  const [reportTo,setReportTo]=useState('');
  const [newOrderCount,setNewOrderCount]=useState(0);
  const [toast,setToast]=useState(null);

  const showToast=(msg,type='success')=>{setToast({msg,type});setTimeout(()=>setToast(null),2500);};

  useEffect(()=>{document.body.classList.toggle('dark',darkMode);localStorage.setItem('choco_dark',String(darkMode));},[darkMode]);

  useEffect(()=>{
    // localStorage is ALWAYS source of truth for admin
    try{
      const sc=localStorage.getItem('chocolush_customers');
      if(sc)setCustomers(JSON.parse(sc));
      else{const d=[{id:genId(),name:'Mr. Bake',phone:'',email:'',address:''},{id:genId(),name:'Others',phone:'',email:'',address:''}];setCustomers(d);localStorage.setItem('chocolush_customers',JSON.stringify(d));}
      const sp=localStorage.getItem('chocolush_products');
      if(sp){setProducts(JSON.parse(sp));}
      else{const d=[{id:genId(),code:'KC01',name:'Big Kunafa Chocolate',price:250,description:'',image_url:''},{id:genId(),code:'KC02',name:'Med. Kunafa Chocolate',price:125,description:'',image_url:''},{id:genId(),code:'KC03',name:'Mini Kunafa Bites',price:40,description:'',image_url:''}];setProducts(d);localStorage.setItem('chocolush_products',JSON.stringify(d));}
      const st=localStorage.getItem('chocolush_transactions');
      if(st)setTransactions(JSON.parse(st));
    }catch(e){console.error(e);}
    setLoading(false);
  },[]);

  // Sync products to Supabase
  useEffect(()=>{
    if(products.length===0)return;
    // No bulk sync on load - products are synced individually on add/edit/delete
  },[products]);

  // Poll pending orders count
  useEffect(()=>{
    const poll=async()=>{const{count}=await window.__sb.from('orders').select('*',{count:'exact',head:true}).eq('status','pending');setNewOrderCount(count||0);};
    poll();const iv=setInterval(poll,15000);return()=>clearInterval(iv);
  },[]);

  const saveCustomers=d=>{setCustomers(d);localStorage.setItem('chocolush_customers',JSON.stringify(d));};
  const saveProducts=d=>{setProducts(d);localStorage.setItem('chocolush_products',JSON.stringify(d));};
  const saveTransactions=d=>{setTransactions(d);localStorage.setItem('chocolush_transactions',JSON.stringify(d));};

  const addCustomer=c=>{saveCustomers([...customers,{...c,id:genId()}]);setShowCustomerModal(false);setEditingCustomer(null);};
  const updateCustomer=c=>{saveCustomers(customers.map(x=>x.id===c.id?c:x));setShowCustomerModal(false);setEditingCustomer(null);};
  const deleteCustomer=id=>{if(!window.confirm('Delete?'))return;saveCustomers(customers.filter(c=>c.id!==id));};
  const syncProductToSupabase=async(p)=>{
    try{
      // Don't store base64 images in Supabase (too large) — store empty string instead
      const imgUrl=(p.image_url&&!p.image_url.startsWith('data:'))?p.image_url:'';
      const row={
        id:String(p.id),
        code:p.code||'',
        name:p.name,
        price:parseFloat(p.price)||0,
        description:p.description||'',
        image_url:imgUrl
      };
      const{error}=await window.__sb.from('products').upsert(row,{onConflict:'id'});
      if(error){console.error('Supabase sync error:',error);showToast('Sync error: '+error.message,'error');}
      else{showToast('Product synced to store ✓');}
    }catch(e){console.error('Sync failed:',e);}
  };
  const addProduct=async p=>{
    const np={...p,id:genId()};
    saveProducts([...products,np]);
    setShowProductModal(false);setEditingProduct(null);
    showToast('Product added!');
    await syncProductToSupabase(np);
  };
  const updateProduct=async p=>{
    saveProducts(products.map(x=>x.id===p.id?p:x));
    setShowProductModal(false);setEditingProduct(null);
    showToast('Product updated!');
    await syncProductToSupabase(p);
  };
  const deleteProduct=async id=>{
    if(!window.confirm('Delete this product from billing AND store?'))return;
    saveProducts(products.filter(p=>p.id!==id));
    showToast('Product deleted.','info');
    try{await window.__sb.from('products').delete().eq('id',String(id));}catch(e){console.error(e);}
  };

  const addToBill=product=>{
    const ex=bill.items.find(i=>i.product.id===product.id);
    if(ex)setBill({...bill,items:bill.items.map(i=>i.product.id===product.id?{...i,quantity:i.quantity+1}:i)});
    else setBill({...bill,items:[...bill.items,{product,quantity:1,offerPrice:null,itemDiscount:0,itemDiscountType:'percent'}]});
  };
  const updateQuantity=(productId,qty)=>{if(qty<1)setBill({...bill,items:bill.items.filter(i=>i.product.id!==productId)});else setBill({...bill,items:bill.items.map(i=>i.product.id===productId?{...i,quantity:qty}:i)});};
  const updateOfferPrice=(productId,op)=>setBill({...bill,items:bill.items.map(i=>i.product.id===productId?{...i,offerPrice:op===''?null:parseFloat(op)}:i)});
  const updateItemDiscount=(productId,discount,discountType)=>setBill({...bill,items:bill.items.map(i=>i.product.id===productId?{...i,itemDiscount:parseFloat(discount)||0,itemDiscountType:discountType||i.itemDiscountType}:i)});
  const getUnitPrice=item=>(item.offerPrice!==null&&item.offerPrice!==undefined)?item.offerPrice:item.product.price;
  const getItemNet=item=>{const base=getUnitPrice(item)*item.quantity;const d=item.itemDiscountType==='percent'?(base*(item.itemDiscount||0)/100):(item.itemDiscount||0);return base-Math.min(d,base);};
  const calculateBill=()=>{
    const originalSubtotal=bill.items.reduce((s,i)=>s+(i.product.price*i.quantity),0);
    const afterOfferSubtotal=bill.items.reduce((s,i)=>s+(getUnitPrice(i)*i.quantity),0);
    const itemsSubtotal=bill.items.reduce((s,i)=>s+getItemNet(i),0);
    const offerDiscountTotal=originalSubtotal-afterOfferSubtotal;
    const itemDiscountTotal=afterOfferSubtotal-itemsSubtotal;
    const tradeDiscount=bill.discountType==='percentage'?(itemsSubtotal*bill.discount/100):Math.min(bill.discount,itemsSubtotal);
    const total=itemsSubtotal-tradeDiscount;
    return{originalSubtotal,afterOfferSubtotal,itemsSubtotal,offerDiscountTotal,itemDiscountTotal,tradeDiscount,total};
  };

  const syncToSheet=async(t,action='upsert')=>{
    const itemsStr=t.items?t.items.map(i=>`${i.product.name}(x${i.quantity})`).join(', '):'';
    const payload={action,BillNo:t.billNumber,CustomerName:t.customerName,CustomerPhone:t.customerPhone||'N/A',Items:itemsStr,Total:t.total,Paid:t.paidAmount,Unpaid:t.remainingAmount,Date:new Date(t.date).toLocaleString('en-IN')};
    try{await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});}catch(e){}
  };

  const completeBill=isPaid=>{
    if(!selectedCustomer||bill.items.length===0)return;
    const{originalSubtotal,afterOfferSubtotal,itemsSubtotal,offerDiscountTotal,itemDiscountTotal,tradeDiscount,total}=calculateBill();
    const t={id:genId(),billNumber:genBillNo(),customerId:selectedCustomer.id,customerName:selectedCustomer.name,customerPhone:selectedCustomer.phone,items:bill.items,subtotal:originalSubtotal,afterOfferSubtotal,itemsSubtotal,offerDiscountTotal,itemDiscountTotal,discount:tradeDiscount,total,isPaid,paidAmount:isPaid?total:0,remainingAmount:isPaid?0:total,date:new Date().toISOString(),payments:isPaid?[{amount:total,date:new Date().toISOString(),method:'Full Payment'}]:[]};
    saveTransactions([...transactions,t]);
    setSelectedTransaction(t);
    syncToSheet(t);
    setShowBillPreview(true);
  };

  const clearBill=()=>{setBill({items:[],discount:0,discountType:'percentage'});setSelectedCustomer(null);setShowBillPreview(false);};

  const addPayment=()=>{
    if(!selectedTransaction||!paymentAmount||parseFloat(paymentAmount)<=0)return;
    const amount=parseFloat(paymentAmount);
    if(amount>selectedTransaction.remainingAmount){alert('Exceeds remaining!');return;}
    const updated=transactions.map(t=>{if(t.id!==selectedTransaction.id)return t;const np=t.paidAmount+amount;const nr=t.total-np;const u={...t,paidAmount:np,remainingAmount:nr,isPaid:nr<=0,payments:[...(t.payments||[]),{amount,date:new Date().toISOString(),method:'Partial Payment'}]};syncToSheet(u);return u;});
    saveTransactions(updated);setSelectedTransaction(updated.find(t=>t.id===selectedTransaction.id));setShowPaymentModal(false);setPaymentAmount('');
  };

  const togglePaymentStatus=id=>{
    const updated=transactions.map(t=>{if(t.id!==id)return t;const u=t.isPaid?{...t,isPaid:false,paidAmount:0,remainingAmount:t.total,payments:[]}:{...t,isPaid:true,paidAmount:t.total,remainingAmount:0,payments:[{amount:t.total,date:new Date().toISOString(),method:'Full Payment'}]};syncToSheet(u);return u;});
    saveTransactions(updated);if(selectedTransaction?.id===id)setSelectedTransaction(updated.find(t=>t.id===id));
  };

  const deleteTransaction=id=>{
    if(!window.confirm('Delete this transaction?'))return;
    const tx=transactions.find(t=>t.id===id);if(tx)syncToSheet(tx,'delete');
    saveTransactions(transactions.filter(t=>t.id!==id));setShowDetailsModal(false);setShowBillPreview(false);setSelectedTransaction(null);
  };

  const generateBillText=t=>{
    const LINE_WIDTH=40;
    let text=`----------------------------------------\n         CHOCOLUSH          \n     Premium Kunafa Chocolates     \n----------------------------------------\n\nBill No: ${t.billNumber}\nDate: ${new Date(t.date).toLocaleString('en-IN')}\nCustomer: ${t.customerName}\n`;
    if(t.customerPhone)text+=`Phone: ${t.customerPhone}\n`;
    text+=`\n----------------------------------------\nITEMS:\n----------------------------------------\n`;
    t.items.forEach(item=>{const u=(item.offerPrice!==null&&item.offerPrice!==undefined)?item.offerPrice:item.product.price;const base=u*item.quantity;const d=item.itemDiscountType==='percent'?(base*(item.itemDiscount||0)/100):(item.itemDiscount||0);const net=base-Math.min(d,base);const nameLine=`${item.product.name} (${item.quantity} pcs)`;text+=`${nameLine}\n`;const mrpStr=`MRP ${item.product.price.toFixed(2)} @ ${u.toFixed(2)}`;const totalStr=net.toFixed(2);const dots=LINE_WIDTH-mrpStr.length-totalStr.length-1;text+=`${mrpStr} ${dots>2?'.'.repeat(dots):' '} ${totalStr}\n\n`;});
    text+=`----------------------------------------\nMRP Total:   Rs.${(t.subtotal||0).toFixed(2)}\n`;
    if((t.offerDiscountTotal||0)>0)text+=`Offer Disc:  -Rs.${t.offerDiscountTotal.toFixed(2)}\n`;
    if((t.itemDiscountTotal||0)>0)text+=`Item Disc:   -Rs.${t.itemDiscountTotal.toFixed(2)}\n`;
    if((t.discount||0)>0)text+=`Trade Disc:  -Rs.${t.discount.toFixed(2)}\n`;
    text+=`----------------------------------------\nTOTAL:       Rs.${t.total.toFixed(2)}\n----------------------------------------\n\n`;
